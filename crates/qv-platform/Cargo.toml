[package]
name = "qv-platform"
description = "QuickVault OS services and Linux/Windows adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The desktop app's GTK clipboard on Wayland (plan 0055); the CLI leaves it off.
gtk = ["dep:gtk"]

[dependencies]
qv-crypto.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "event", "net", "termios", "stdio"] }
x11rb.workspace = true
x11rb-protocol.workspace = true

async-io = "=2.6.0"
futures-lite = "=2.6.1"
zbus = { version = "=6.2.0", default-features = false, features = ["default-rt", "proxy"] }
gtk = { version = "=0.18.2", optional = true }

[target.'cfg(windows)'.dependencies]
qv-win.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "=6.2.0", default-features = false, features = ["service"] }
rustix = { workspace = true, features = ["pipe"] }

[lints]
workspace = true
