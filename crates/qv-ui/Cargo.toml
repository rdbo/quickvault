# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "qv-ui"
description = "QuickVault app page: the Leptos view (wasm32-unknown-unknown) shown by the Tauri shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qv-ui-api.workspace = true
serde_json.workspace = true
zeroize.workspace = true
leptos = { version = "=0.8.23", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Document", "DomRect", "Element", "Event", "EventTarget", "HtmlDivElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "MouseEvent", "Node", "NodeList", "Window"] }

[lints]
workspace = true
