[package]
name = "qv-store"
description = "QuickVault vault file: hardened SQLite, header and keyslots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qv-crypto.workspace = true
qv-encoding.workspace = true
qv-model.workspace = true
rusqlite.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
qv-win.workspace = true

[dev-dependencies]
proptest.workspace = true
# Test-only KDF serialization and memo (qv-crypto `test-kdf-limit`).
qv-crypto = { workspace = true, features = ["test-kdf-limit"] }

[target.'cfg(windows)'.dev-dependencies]
qv-win.workspace = true

[lints]
workspace = true
