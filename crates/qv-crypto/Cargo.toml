[package]
name = "qv-crypto"
description = "QuickVault cryptography and protected memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
argon2-opaque.workspace = true
opaque-ke.workspace = true
sha2-opaque.workspace = true
chacha20poly1305.workspace = true
ctutils.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
libcrux-kem.workspace = true
qv-encoding.workspace = true
region.workspace = true
sha1.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
# Derandomized X-Wing for interoperability vectors (plan 0037). Enabled only
# by dev-dependencies; never in normal builds.
test-vectors = []
# Test builds only, enabled from dev-dependencies: one shared Argon2 slot
# (memory limit) and a memo of full-profile results by password, salt and
# profile, so copied fixture vaults run the real KDF once per test binary.
test-kdf-limit = []

[lints]
workspace = true
