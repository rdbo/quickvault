[package]
name = "qv-app"
description = "QuickVault shared Android and Linux application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[features]
default = []
desktop = ["dep:dioxus", "dep:dioxus-desktop", "qv-platform/gtk"]
mobile = ["desktop"]
validation = ["desktop"]
[[bin]]
name = "quickvault"
path = "src/main.rs"
required-features = ["desktop"]
[dependencies]
qv-core.workspace = true
ctutils.workspace = true
zeroize.workspace = true
qrcodegen-no-heap = "=1.8.1"
quircs = "=0.10.3"
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["minimal"] }
dioxus-desktop = { version = "=0.7.10", optional = true, default-features = false, features = ["tokio_runtime"] }
# Only to enable its GTK clipboard with `desktop` (plan 0055); the app reaches
# platform services through qv-core.
[target.'cfg(target_os = "linux")'.dependencies]
qv-platform.workspace = true
[dev-dependencies]
qv-core = { workspace = true, features = ["test-kdf-limit", "test-eager-views"] }

[lints]
workspace = true

[[bin]]
name = "qv-boundary-harness"
path = "src/bin/boundary_harness.rs"
required-features = ["validation"]

[[bin]]
name = "qv-ui-preview"
path = "src/bin/ui_preview.rs"
required-features = ["validation"]

[[bin]]
name = "qv-flow-harness"
path = "src/bin/flow_harness.rs"
required-features = ["validation"]
