[package]
name = "qv-cli"
description = "QuickVault command-line client (qvault)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "qvault"
path = "src/main.rs"

# Frontends depend on qv-core only (ARCHITECTURE.md §3); a test checks this
# list, so no networking crate is added unnoticed.
[dependencies]
clap.workspace = true
qv-core.workspace = true
rustix = { workspace = true, features = ["termios", "stdio", "event", "net"] }
signal-hook.workspace = true
x11rb.workspace = true
x11rb-protocol.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
rustix = { workspace = true, features = ["termios", "stdio", "pty", "fs", "event", "pipe"] }

[lints]
workspace = true
