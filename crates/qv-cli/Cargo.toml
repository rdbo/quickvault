[package]
name = "qv-cli"
description = "QuickVault command-line client (qv)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "qv"
path = "src/main.rs"

# Frontends depend on qv-core only (ARCHITECTURE.md §3); a test checks this
# list, so no networking crate is added unnoticed.
[dependencies]
clap.workspace = true
qv-core.workspace = true
signal-hook.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios", "stdio", "event", "net"] }

[target.'cfg(windows)'.dependencies]
qv-win.workspace = true

[dev-dependencies]
qv-core = { workspace = true, features = ["test-kdf-limit", "test-eager-views"] }
proptest.workspace = true

# The end-to-end harness drives a PTY and an X11 clipboard (Linux).
[target.'cfg(unix)'.dev-dependencies]
x11rb.workspace = true
rustix = { workspace = true, features = ["termios", "stdio", "pty", "fs", "event", "pipe"] }

[lints]
workspace = true
