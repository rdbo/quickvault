[package]
name = "qv-core"
description = "QuickVault core: sessions, views and vault operations for every frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qv-crypto.workspace = true
qv-model.workspace = true
qv-store.workspace = true
qv-sync.workspace = true
qv-platform.workspace = true
zeroize.workspace = true
zxcvbn.workspace = true

[dev-dependencies]
qv-crypto = { workspace = true, features = ["test-kdf-limit"] }
proptest.workspace = true
qv-encoding.workspace = true

[features]
test-kdf-limit = ["qv-crypto/test-kdf-limit"]
# Eager reference projections for small test fixtures; never production frontends.
test-eager-views = []

[lints]
workspace = true
