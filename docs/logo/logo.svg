  <title id="logo-title">QuickVault</title>
  <desc id="logo-desc">A mint-green vault door with two hinges on a charcoal tile. Its combination dial is cut out of the door and turned so that the ring and a short rounded tail crossing it form the letter Q, with the dial hub as its centre.</desc>
