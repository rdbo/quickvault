[package]
name = "qv-proto-ui"
description = "Plan 0070 prototype: the Leptos page (wasm32-unknown-unknown)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qv-proto-api.workspace = true
serde_json.workspace = true
zeroize.workspace = true
leptos = { version = "=0.8.23", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Document", "Element", "Event", "EventTarget", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Node", "NodeList", "Window"] }

[lints]
workspace = true
