[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rdbo/quickvault"
publish = false

[workspace.dependencies]
getrandom = "=0.4.3"
region = "=4.0.1"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
