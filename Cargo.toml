[workspace]
resolver = "3"
members = ["crates/*"]
# Fuzz targets have their own workspace and lockfile (fuzz/Cargo.toml).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rdbo/quickvault"
publish = false

[workspace.dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
ctutils = { version = "=0.4.5", default-features = false }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
qv-crypto = { path = "crates/qv-crypto", version = "=0.0.0" }
qv-encoding = { path = "crates/qv-encoding", version = "=0.0.0" }
region = "=4.0.1"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
unicode-normalization = { version = "=0.1.26", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Argon2 at the full password-kdf/1 profile (256 MiB, t=3) takes minutes
# unoptimized; optimize it (and its BLAKE2b) in dev/test builds only.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
