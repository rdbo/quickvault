# cargo-deny configuration (spec 0012 §3): advisories, licenses, bans, sources.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Only what the current dependency tree needs; extend deliberately.
allow = [
    "Apache-2.0",
    "MIT",
    # Unicode Character Database tables in unicode-normalization (NFC, spec
    # 0002 §3.1); owner-approved 2026-10-25 (plan 0005).
    "Unicode-3.0",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are `publish = false` and AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

