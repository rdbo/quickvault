# under `cfg(valgrind_ct_test)` (its own constant-time test tooling). That cfg
# is never set in QuickVault builds, so bindgen is never compiled or shipped.
[[licenses.exceptions]]
name = "bindgen"
version = "=0.72.1"
allow = ["BSD-3-Clause"]
