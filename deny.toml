# cargo-deny configuration (spec 0012 §3): advisories, licenses, bans, sources.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Plan 0032 (owner, 2026-11-02): published crates replace maintained forks.
# The Linux webview stack (tao/wry on GTK3) pins glib 0.18 and selectors 0.24.
# Revisit when tao/wry leave GTK3 or these crates publish fixes.
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter (Variant::array_iter_str) is unsound; neither QuickVault nor any GTK/WebKit/tao/wry/muda crate in the build calls it; no 0.18 fix exists" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained (no vulnerability); compile-time helper of glib-macros/gtk3-macros 0.18" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained (no vulnerability); non-cryptographic hasher inside selectors 0.24" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7 is only a build dependency of selectors' phf code generator, without the log feature the advisory requires; it does not ship" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained (no vulnerability); reached only through hax-lib-macros 0.3, a cfg(hax) dependency of libcrux used by its formal-verification tooling and never compiled in QuickVault builds (plan 0036)" },
]

[licenses]
# Only what the current dependency tree needs; extend deliberately.
allow = [
    "Apache-2.0",
    "MIT",
    # Unicode Character Database tables in unicode-normalization (NFC, spec
    # 0002 §3.1); owner-approved 2026-10-25 (plan 0005).
    "Unicode-3.0",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are `publish = false` and AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

