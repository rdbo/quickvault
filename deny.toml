# Plan 0036: build dependency of `crabgrind`, which libcrux-secrets uses only
# under `cfg(valgrind_ct_test)` (its own constant-time test tooling). That cfg
# is never set in QuickVault builds, so bindgen is never compiled or shipped.
[[licenses.exceptions]]
name = "bindgen"
version = "=0.72.1"
allow = ["BSD-3-Clause"]

# Plan 0047: exact transitive Ristretto implementation selected by opaque-ke.
# Package metadata and cargo-deny's license identification agree on BSD-3-Clause.
[[licenses.exceptions]]
name = "curve25519-dalek"
version = "=4.1.3"
allow = ["BSD-3-Clause"]

# Plan 0071: exact licences of the Tauri and Leptos dependency trees, owner
