# cargo-deny configuration (spec 0012 §3): advisories, licenses, bans, sources.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Plan 0032 (owner, 2026-11-02): published crates replace maintained forks.
# The Linux webview stack (Tauri's tao/wry on GTK3, plan 0071) pins glib 0.18.
# Revisit when tao/wry leave GTK3 or these crates publish fixes.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Plan 0047: crypto-bigint 0.5.5 is pulled by opaque-ke 4.0.1/voprf 0.5.0 generic elliptic-curve adapters. The fixed Ristretto255 OPRF/TripleDh suite uses dalek arithmetic and only the byte-oriented XMD expander from elliptic-curve; the affected integer operations are not used. Recheck suite, features and reverse-dependency paths on any change; exact source trace in plans/0047-audit-policy-and-lan-auth/DEPENDENCIES.md. Owner 2026-11-09: retain if no beneficial security improvement." },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter (Variant::array_iter_str) is unsound; neither QuickVault nor any GTK/WebKit/tao/wry/muda/tauri crate in the build calls it; no 0.18 fix exists" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained (no vulnerability); compile-time helper of glib-macros/gtk3-macros 0.18" },
    { id = "RUSTSEC-2026-0543", reason = "Plan 0071: chrono unmaintained (no vulnerability); zxcvbn 3.1.1 depends on it only for target_arch = wasm32, and QuickVault never builds qv-core for wasm32 (the wasm32 page, qv-ui, does not depend on it), so it never ships" },
    { id = "RUSTSEC-2024-0436", reason = "Plan 0071: paste unmaintained (no vulnerability); compile-time macro helper of Leptos (either_of, tachys) for the page" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained (no vulnerability); reached only through hax-lib-macros 0.3, a cfg(hax) dependency of libcrux used by its formal-verification tooling and never compiled in QuickVault builds (plan 0036)" },
]

[licenses]
# Only what the current dependency tree needs; extend deliberately.
allow = [
    "Apache-2.0",
    "MIT",
    # Unicode Character Database tables in unicode-normalization (NFC, spec
    # 0002 §3.1); owner-approved 2026-10-25 (plan 0005).
    "Unicode-3.0",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are `publish = false` and AGPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

