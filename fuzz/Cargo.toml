# Fuzz targets (cargo-fuzz). Not part of the shipped workspace: the root
# workspace excludes this directory and it keeps its own Cargo.lock. Run with
# `cargo +nightly fuzz run <target>`; CI pins the nightly (see ci.yml).

[package]
name = "qv-encoding-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
qv-crypto = { path = "../crates/qv-crypto", version = "=0.0.0" }
qv-encoding = { path = "../crates/qv-encoding", version = "=0.0.0" }
qv-model = { path = "../crates/qv-model", version = "=0.0.0" }
qv-store = { path = "../crates/qv-store", version = "=0.0.0" }

[workspace]
members = ["."]

[[bin]]
name = "cbor_decode"
path = "fuzz_targets/cbor_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_open"
path = "fuzz_targets/vault_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_read"
path = "fuzz_targets/archive_read.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "rotation_journal"
path = "fuzz_targets/rotation_journal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_inventory"
path = "fuzz_targets/snapshot_inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_receipts"
path = "fuzz_targets/archive_receipts.rs"
test = false
doc = false
bench = false
