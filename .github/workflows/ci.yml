# Standard gates (AGENTS.md) and supply-chain checks (spec 0012 §3).
# Actions are pinned by commit SHA; tools by exact version.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SPDX headers
        run: sh scripts/check-spdx.sh
      - name: Offline matrix rows have tagged tests (0012 §1)
        run: sh scripts/check-matrix.sh
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clipboard test server
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: SPDX checker rejection tests
        run: sh scripts/test-check-spdx.sh
      - name: Maintained X11 transport tests
        run: cargo test --manifest-path third-party/x11rb/Cargo.toml --locked --lib rust_connection
      # Ubuntu 24.04 restricts unprivileged user namespaces; the
      # networking-blocked offline test (0012 "Implicit server prerequisite")
      # needs `unshare -rn` and must not skip here.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        env:
          QV_REQUIRE_NETNS: "1"
        run: cargo test --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install cargo-deny and cargo-vet
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-vet --version 0.10.3
      - name: cargo deny
        run: cargo deny check
      - name: cargo vet
        run: cargo vet --locked
      # fuzz/ is a CI-only tool outside the shipped workspace: no license or
      # vet policy (libfuzzer-sys includes NCSA-licensed libFuzzer), but
      # advisories, bans and sources still apply.
      - name: cargo deny (fuzz crate)
        run: cargo deny --manifest-path fuzz/Cargo.toml check advisories bans sources

  fuzz:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains (rust-toolchain.toml and pinned nightly)
        run: |
          rustup toolchain install
          rustup toolchain install "$NIGHTLY" --profile minimal
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Format (fuzz crate)
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      # `cargo fuzz run` has no --locked flag; this fails if fuzz/Cargo.lock is stale.
      - name: Check fuzz lockfile
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Fuzz cbor_decode (60 s)
        run: cargo +"$NIGHTLY" fuzz run cbor_decode -- -max_total_time=60
      - name: Fuzz record_decode (60 s)
        run: cargo +"$NIGHTLY" fuzz run record_decode -- -max_total_time=60
      - name: Fuzz manifest_decode (60 s)
        run: cargo +"$NIGHTLY" fuzz run manifest_decode -- -max_total_time=60
      - name: Fuzz vault_open (60 s)
        run: cargo +"$NIGHTLY" fuzz run vault_open -- -max_total_time=60 -max_len=65536
      - name: Fuzz archive_read (60 s)
        run: cargo +"$NIGHTLY" fuzz run archive_read -- -max_total_time=60 -max_len=262144
      - name: Fuzz rotation_journal (60 s)
        run: cargo +"$NIGHTLY" fuzz run rotation_journal -- -max_total_time=60 -max_len=8192
      - name: Fuzz snapshot_inventory (60 s)
        run: cargo +"$NIGHTLY" fuzz run snapshot_inventory -- -max_total_time=60 -max_len=8192
      - name: Fuzz archive_receipts (60 s)
        run: cargo +"$NIGHTLY" fuzz run archive_receipts -- -max_total_time=60 -max_len=8192
